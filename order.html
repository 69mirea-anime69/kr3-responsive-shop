<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Форма заявки на товар магазина.">
  <title>Заявка — Магазин</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Перейти к содержимому</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">Магазин</a>
      <button class="menu-toggle button" type="button" aria-expanded="false" aria-controls="site-menu" hidden>Меню</button>
      <nav id="site-menu" class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="product.html">Товар</a></li>
          <li class="site-nav__item"><a aria-current="page" class="site-nav__link site-nav__link--active" href="order.html">Заявка</a></li>
          <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
        </ul>
      </nav>
    </div>
  </header>


  <main class="page-container" id="main-content" tabindex="-1">
    <h1>Оставить заявку</h1>
    <form class="order-form" action="#" method="get">
      <div class="order-form__field">
        <label class="order-form__label" for="name">Имя</label>
        <input class="order-form__input" id="name" name="name" type="text" required>
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="email">Электронная почта</label>
        <input class="order-form__input" id="email" name="email" type="email" required>
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="phone">Телефон</label>
        <input class="order-form__input" id="phone" name="phone" type="tel" required>
      </div>
      <div class="order-form__field">
        <label class="order-form__label" for="item">Товар</label>
        <select class="order-form__select" id="item" name="item" required>
          <option value="">Выберите товар</option>
          <option value="lamp">Лампа «Линия»</option>
          <option value="organizer">Органайзер «Порядок»</option>
          <option value="notebook">Блокнот «Точка опоры»</option>
        </select>
      </div>
      <div class="order-form__field order-form__field--full">
        <label class="order-form__label" for="comment">Комментарий</label>
        <textarea class="order-form__textarea" id="comment" name="comment" rows="4"></textarea>
      </div>
      <div class="order-form__field order-form__field--full">
        <p class="order-form__note"><input class="order-form__input" id="consent" name="consent" type="checkbox" required> <label class="order-form__label" for="consent">Согласен(на) на обработку данных</label></p>
      </div>
      <div class="order-form__field order-form__field--full">
        <button class="button button--primary" type="submit">Отправить заявку</button>
        <p class="order-form__note">Пока можно проверить заполнение формы, но отправка ещё не подключена.</p>
      </div>
    </form>
  </main>


  <footer class="site-footer">
  <div class="site-footer__inner">
    <p>Магазин</p>
    <a href="index.html">Главная</a>
    <a href="catalog.html">Каталог</a>
    <a href="contacts.html">Контакты</a>
  </div>
</footer>
</body>
</html>
